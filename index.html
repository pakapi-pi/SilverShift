<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シルバー職員用 4週間シフト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><h1>SilverShift</h1><p class="eyebrow">シルバー職員用・4週間シフト</p></div>
      <div class="header-actions"><button id="autoCreate" class="primary">自動作成</button><button id="shuffle">シャッフル</button><button id="exportCsv">CSV出力</button><button id="clearAll" class="danger">初期化</button></div>
    </header>

    <section class="settings panel">
      <div class="field"><label for="startDate">開始日</label><input id="startDate" type="date"></div>
      <div class="totals"><span>上目標合計 <strong id="upperTotal">0</strong> / 必要 <strong id="upperRequired">28</strong></span><span>下目標合計 <strong id="lowerTotal">0</strong> / 必要 <strong id="lowerRequired">28</strong></span><span id="totalWarning" class="warning"></span></div>
    </section>

    <section class="panel roster-panel">
      <div class="section-title"><h2>職員設定</h2><span>名前・目標日数を入力</span></div>
      <div id="roster" class="roster-grid"></div>
    </section>

    <section class="panel schedule-panel">
      <div class="section-title"><h2>シフト表</h2><span>前回: 空白 / ○　今回: 空白 → ○ → ×</span></div>
      <div class="table-wrap"><table id="schedule"><thead></thead><tbody></tbody></table></div>
      <div class="legend"><span><i class="dot work"></i>出勤 ○</span><span><i class="dot off"></i>希望休 ×</span><span>セルをクリックして変更</span></div>
    </section>

    <section class="panel result-panel" aria-labelledby="resultTitle">
      <h2 id="resultTitle">作成結果・確認事項</h2>
      <div id="messages" class="messages" aria-live="polite"></div>
    </section>
    <footer><span>データはこのブラウザのlocalStorageにのみ保存されます。</span><span id="saveStatus"></span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
